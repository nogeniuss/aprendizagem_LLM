<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Chat - Economia Hoje</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="description" content="Assistente econômico para informações sobre mercado financeiro, indicadores e notícias econômicas" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-container">
    <!-- HEADER -->
    <header class="header">
      <div class="header__logo">
        <img src="logo.png" alt="Economia Hoje" class="header__logo-img" />
        <h1 class="header__title">Economia Hoje</h1>
      </div>
      <div class="header__date" id="currentDate"></div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- Chat Section -->
      <section class="chat">
        <h2 class="section-title">Assistente Econômico</h2>
        <div class="chat__container">
          <div class="chat__messages" id="chat-messages">
            <div class="chat__message chat__message--bot">
              <span>💬</span> Olá! Sou seu assistente econômico. Como posso ajudar hoje?
            </div>
          </div>
        </div>

        <form class="chat__form" id="questionForm">
          <div class="input-group">
            <textarea
              id="questionInput"
              placeholder="Digite sua pergunta sobre economia ou finanças..."
              rows="1"
              required
            ></textarea>
            <button type="submit" class="input-group__button" id="sendButton" aria-label="Enviar pergunta">
              <span>📤</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Image Generator Section -->
      <section class="image-generator">
        <h2 class="section-title">Gerar Imagem pela IA</h2>
        <div class="input-group">
          <input
            type="text"
            id="prompt-imagem"
            placeholder="Descreva a imagem que deseja gerar"
            aria-label="Descrição da imagem"
          />
          <button id="gerarImagemBtn" class="input-group__button" aria-label="Gerar imagem">
            🎨 Gerar
          </button>
        </div>
        <div id="resultado-imagem" class="resultado-imagem"></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__content">
        <p>© 2025 Economia Hoje - Assistente Econômico</p>
        <p class="footer__disclaimer">
          Dados fornecidos apenas para fins informativos. Não constitui aconselhamento financeiro.
        </p>
      </div>
    </footer>
  </div>

  <script src="./script.js"></script>
</body>
</html>
